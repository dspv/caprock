version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # modernc.org/libc moves with modernc.org/sqlite, which names the libc
      # it was built against; bumped alone (#1012, libc 1.82.2 under sqlite
      # 1.62.0) the Windows store tests ran twice as long and once timed out.
      - dependency-name: modernc.org/libc
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
