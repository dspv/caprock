name: ci

on:
  push:
    branches: [master]
  # Draft pull requests run nothing: contributors iterate with `make check`
  # locally and CI runs once, when the PR is marked ready (ADR-061).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request cancels the run it supersedes. A push to master
# never cancels: every master commit gets its full run, and that run is what
# writes the caches pull requests read.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What a pull request touches, so the desktop app's three builds (the
  # slowest jobs here, 4-7 min each) run only when something they build from
  # changed. The app bundles app/ and a daemon built from Go that the go job
  # already compiles on every OS; the dashboard is not in it (the window loads
  # it from the daemon). A push to master always runs everything, and so does
  # a pull request whose file list cannot be read.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "could not list the PR's files: running everything"; echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          app=false
          if grep -qE '^(app/|Makefile$|scripts/check-app-mic\.sh$|scripts/check-app-signature\.sh$|scripts/macos-selfsign-keychain\.sh$|\.github/workflows/ci\.yml$)' <<<"$files"; then app=true; fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  # A pull request never carries internal/api/dist (ADR-068). The built
  # dashboard is content-hashed, so any two PRs that rebuilt it conflicted
  # there whatever else they touched; master's dist workflow rebuilds it after
  # each merge instead. The checkout is the PR's merge commit, so its first
  # parent is master as it stands now and the diff is exactly what merging
  # would change.
  no-dist:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    name: no dist in the PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: the PR leaves internal/api/dist alone
        run: |
          if git diff --quiet HEAD^1 HEAD -- internal/api/dist; then echo "dist untouched"; exit 0; fi
          echo "::error title=internal/api/dist is in this PR::dist is rebuilt on master after merge; drop your dist changes: make dist-reset && git commit -m 'chore: drop the dist changes' (or: git checkout origin/master -- internal/api/dist after rebasing on origin/master)"
          git --no-pager diff --stat HEAD^1 HEAD -- internal/api/dist | tail -5
          exit 1

  ui:
    if: ${{ !github.event.pull_request.draft }}
    name: ui (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test -- --run
        working-directory: ui
      - name: release script tests (latest.json)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # The dashboard builds. Its output is thrown away: master's dist
      # workflow commits the build (ADR-068).
      - run: npm run build
        working-directory: ui

  # The app's golden paths in a headless browser (make e2e, ui/e2e): this
  # commit's dashboard against a sandboxed daemon with the fake claude. Ubuntu
  # only: the go matrix already runs the daemon on three OS, and what this adds
  # is the page. The headless shell is cached by the Playwright version.
  e2e:
    if: ${{ !github.event.pull_request.draft }}
    name: e2e (headless shell)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The Go cache the go job writes on master; read-only here.
      - name: go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: playwright version
        id: pw
        working-directory: ui
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Written from master only, as the Go cache is.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: headless shell
        if: steps.pwcache.outputs.cache-hit != 'true'
        working-directory: ui
        run: npx playwright install --with-deps chromium-headless-shell
      - name: headless shell's system libraries
        if: steps.pwcache.outputs.cache-hit == 'true'
        working-directory: ui
        run: npx playwright install-deps chromium-headless-shell
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.pwcache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: make e2e
        run: make e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        if: failure()
        with:
          name: e2e-report
          path: |
            ui/e2e/report/
            ui/e2e/results/
          retention-days: 7

  # The go jobs build against master's committed internal/api/dist, which can
  # be one merge behind ui/ (ADR-068), rather than building the dashboard on
  # three OS: no Go test reads the dashboard's bytes (they serve fakes), the
  # ui job proves it builds, and make-windows runs `make build`, which builds
  # it on Windows too. Building it here would add npm to every leg for nothing
  # a Go test can see.
  go:
    if: ${{ !github.event.pull_request.draft }}
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The Go build and module cache. Only this job writes it (its last step,
      # on master): with setup-go's cache every job shared one key, whichever
      # finished first saved it, and Windows ended up with a 28 MB cache that held
      # almost none of what the go job compiles.
      - name: go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gorestore
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: `latest` moved to v2.15.0 on 2026-10-16 and turned every PR red
          # over untouched code. Bump on purpose, with the fixes, in one PR.
          version: v2.14.0
      - name: go test
        run: go test -v -count=1 ./...
      - name: build
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X github.com/dspv/caprock/internal/version.Version=${GITHUB_SHA::7}" -o bin/ ./cmd/...
      - name: smoke (Phase 0 DoD scenario)
        run: go test -count=1 -tags smoke ./internal/smoke/... ./internal/board/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: caprock-${{ matrix.os }}
          path: bin/
          retention-days: 3
      # The one writer of the Go cache: on master, once per go.mod/go.sum, from
      # the job that compiles everything (vet, tests, -trimpath binaries, smoke).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.gorestore.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}

  # T0 — ConPTY spike. Informational: it must never redden the required jobs
  # (ADR-006 / .ai/09-execution-plan.md T0). Its result is the go/no-go for T11.
  pty-spike:
    if: ${{ !github.event.pull_request.draft }}
    name: pty spike (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # No Go cache: the spike compiles one package tree, and restoring the
      # daemon's cache took longer on Windows than compiling it.
      - name: spike
        run: go test -count=1 -v -tags ptyspike ./internal/ptyman/...

  # `make build` on Windows, which nothing else here checks.
  #
  # Every other job invokes go and npm directly, so the Windows matrix stayed
  # green for months while the first command in CONTRIBUTING.md failed on a
  # Windows clone (FB-025). A green matrix is not the same as a working
  # repository, and the only way to keep this fixed is to run the thing a
  # contributor actually runs.
  make-windows:
    if: ${{ !github.event.pull_request.draft }}
    name: make build (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The Go cache the go job writes on master; read-only here.
      - name: go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The default shell here is PowerShell; a contributor's is whatever their
      # terminal is. What is being tested is that make itself works, so invoke
      # it the plainest way and let the Makefile pick its own shell.
      - name: make build
        run: make build
      - name: the binaries exist
        run: |
          if (-not (Test-Path bin/caprock.exe)) { throw "bin/caprock.exe missing" }
          if (-not (Test-Path bin/caprock-hook.exe)) { throw "bin/caprock-hook.exe missing" }
          if (-not (Test-Path bin/caprock-pty-host.exe)) { throw "bin/caprock-pty-host.exe missing" }

  # The desktop app (app/, Tauri v2; ADR-038): fmt, clippy and tests on every
  # OS, then a release bundle so a packaging break shows up in the PR rather
  # than at release time. Linux builds against WebKitGTK 4.1, Tauri v2's floor.
  app:
    name: app (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          # 22.04, the image release.yml builds the Linux app on, so the Rust
          # cache this leg writes on master is the one the release reads.
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The Go cache the go job writes on master; read-only here.
      - name: go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # Cargo's registry and the compiled dependencies, keyed by OS, rustc and
      # Cargo.lock; the app crate itself always rebuilds. Written from master
      # only. release.yml's Windows and Linux app jobs read the same keys.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target
          shared-key: app-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' }}
      - name: fmt, clippy, test
        run: make app-test
      # The stable self-signed identity, as in release.yml; without its
      # secrets (a pull request from a fork) the bundle is ad-hoc, as before.
      - name: stable signing identity
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/macos-selfsign-keychain.sh
        env:
          MACOS_SELFSIGN_P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12_BASE64 || '' }}
          MACOS_SELFSIGN_P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD || '' }}
      - name: bundle
        run: make app-bundle APP_BUNDLES=${{ matrix.bundles }}
      # The branded .dmg window: the picture has to be inside the image, or
      # the window opens as a bare Finder folder and nothing else says so.
      - name: dmg background
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          ls -la "$mnt" "$mnt/.background"
          ls "$mnt/.background/"*.png >/dev/null
          test -d "$mnt/Caprock.app"
          test -L "$mnt/Applications"
      # The microphone (ADR-045): without the entitlement the hardened
      # runtime refuses an agent's voice mode silently.
      - name: microphone entitlement
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/check-app-mic.sh app/src-tauri/target/release/bundle/macos/Caprock.app
      # Signed with the stable identity when it was set up (each binary's
      # requirement is identifier + certificate leaf), else ad-hoc.
      - name: signature
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/check-app-signature.sh app/src-tauri/target/release/bundle/macos/Caprock.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: caprock-app-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3

  # The Rust cache for release.yml's macOS app build, which compiles for
  # aarch64 and x86_64 (a universal .dmg) where the app job above builds the
  # host's architecture only. A tag cannot read a cache another tag wrote, so
  # master writes it: `app-release.sh --warm-cache` makes the release's own
  # cargo build, unsigned, and keeps nothing but the cache. The lookup makes
  # this a few seconds on a push that finds the cache already there (one key
  # per rustc version and Cargo.lock, as for the app job); the build runs
  # only when one of those changed or the cache was evicted.
  app-release-cache:
    if: github.event_name == 'push'
    name: app release cache (macos universal)
    runs-on: macos-latest
    # As release.yml's app-macos-build: rust-cache hashes CARGO_* variables
    # into its key, so the two jobs' must not differ.
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: lookup
        with:
          workspaces: app/src-tauri -> target
          shared-key: app-macos-universal
          lookup-only: true
          save-if: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: go cache paths
        if: steps.lookup.outputs.cache-hit != 'true'
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Restores an older key's dependencies when there is one, and saves the
      # new key when the job ends.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          workspaces: app/src-tauri -> target
          shared-key: app-macos-universal
      - name: universal app, cache only
        if: steps.lookup.outputs.cache-hit != 'true'
        run: scripts/app-release.sh v0.0.0 --warm-cache
