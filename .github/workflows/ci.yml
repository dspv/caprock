name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: ui (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test -- --run
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: dist is committed and in sync (so `go install` embeds a real UI)
        run: |
          git diff --quiet -- internal/api/dist || {
            echo "internal/api/dist/ is stale — run 'make ui' and commit the result";
            git --no-pager diff --stat -- internal/api/dist; exit 1; }
      - uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: ui-dist
          path: internal/api/dist
          if-no-files-found: error

  go:
    name: go (${{ matrix.os }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: ui-dist
          path: internal/api/dist
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: latest
      - name: go test
        run: go test -v -count=1 ./...
      - name: build
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X github.com/dspv/caprock/internal/version.Version=${GITHUB_SHA::7}" -o bin/ ./cmd/...
      - name: smoke (Phase 0 DoD scenario)
        run: go test -count=1 -tags smoke ./internal/smoke/... ./internal/board/...
      - uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: caprock-${{ matrix.os }}
          path: bin/

  # T0 — ConPTY spike. Informational: it must never redden the required jobs
  # (ADR-006 / .ai/09-execution-plan.md T0). Its result is the go/no-go for T11.
  pty-spike:
    name: pty spike (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: spike
        run: go test -count=1 -v -tags ptyspike ./internal/ptyman/...

  # `make build` on Windows, which nothing else here checks.
  #
  # Every other job invokes go and npm directly, so the Windows matrix stayed
  # green for months while the first command in CONTRIBUTING.md failed on a
  # Windows clone (FB-025). A green matrix is not the same as a working
  # repository, and the only way to keep this fixed is to run the thing a
  # contributor actually runs.
  make-windows:
    name: make build (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The default shell here is PowerShell; a contributor's is whatever their
      # terminal is. What is being tested is that make itself works, so invoke
      # it the plainest way and let the Makefile pick its own shell.
      - name: make build
        run: make build
      - name: the binaries exist
        run: |
          if (-not (Test-Path bin/caprock.exe)) { throw "bin/caprock.exe missing" }
          if (-not (Test-Path bin/caprock-hook.exe)) { throw "bin/caprock-hook.exe missing" }
