name: ci

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels the run it supersedes. A push to master
# never cancels: every master commit gets its full run, and that run is what
# writes the caches pull requests read.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What a pull request touches, so the desktop app's three builds (the
  # slowest jobs here, 4-7 min each) run only when something they build from
  # changed. The app bundles app/ and a daemon built from Go that the go job
  # already compiles on every OS; the dashboard is not in it (the window loads
  # it from the daemon). A push to master always runs everything, and so does
  # a pull request whose file list cannot be read.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "could not list the PR's files: running everything"; echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          app=false
          if grep -qE '^(app/|Makefile$|scripts/check-app-mic\.sh$|\.github/workflows/ci\.yml$)' <<<"$files"; then app=true; fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  ui:
    name: ui (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test -- --run
        working-directory: ui
      - name: release script tests (latest.json)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run build
        working-directory: ui
      - name: dist is committed and in sync (so `go install` embeds a real UI)
        run: |
          git diff --quiet -- internal/api/dist || {
            echo "internal/api/dist/ is stale — run 'make ui' and commit the result";
            git --no-pager diff --stat -- internal/api/dist; exit 1; }

  # The go jobs build against the committed internal/api/dist rather than
  # waiting for the ui job's: the ui job fails when that copy is stale, so a
  # green run tested the same bytes either way, three minutes sooner.
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The Go build and module cache. Only this job writes it (its last step,
      # on master): with setup-go's cache every job shared one key, whichever
      # finished first saved it, and Windows ended up with a 28 MB cache that held
      # almost none of what the go job compiles.
      - name: go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gorestore
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: build
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X github.com/dspv/caprock/internal/version.Version=${GITHUB_SHA::7}" -o bin/ ./cmd/...
      - name: smoke (Phase 0 DoD scenario)
        run: go test -v -count=15 -run TestPhase0DefinitionOfDone -tags smoke ./internal/smoke/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: caprock-${{ matrix.os }}
          path: bin/
          retention-days: 3
      # The one writer of the Go cache: on master, once per go.mod/go.sum, from
      # the job that compiles everything (vet, tests, -trimpath binaries, smoke).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.gorestore.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}

  # T0 — ConPTY spike. Informational: it must never redden the required jobs
  # (ADR-006 / .ai/09-execution-plan.md T0). Its result is the go/no-go for T11.
  pty-spike:
    name: pty spike (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # No Go cache: the spike compiles one package tree, and restoring the
      # daemon's cache took longer on Windows than compiling it.
      - name: spike
        run: go test -count=1 -v -tags ptyspike ./internal/ptyman/...

  # `make build` on Windows, which nothing else here checks.
  #
  # Every other job invokes go and npm directly, so the Windows matrix stayed
  # green for months while the first command in CONTRIBUTING.md failed on a
  # Windows clone (FB-025). A green matrix is not the same as a working
  # repository, and the only way to keep this fixed is to run the thing a
  # contributor actually runs.
  make-windows:
    name: make build (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The Go cache the go job writes on master; read-only here.
      - name: go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The default shell here is PowerShell; a contributor's is whatever their
      # terminal is. What is being tested is that make itself works, so invoke
      # it the plainest way and let the Makefile pick its own shell.
      - name: make build
        run: make build
      - name: the binaries exist
        run: |
          if (-not (Test-Path bin/caprock.exe)) { throw "bin/caprock.exe missing" }
          if (-not (Test-Path bin/caprock-hook.exe)) { throw "bin/caprock-hook.exe missing" }
          if (-not (Test-Path bin/caprock-pty-host.exe)) { throw "bin/caprock-pty-host.exe missing" }

  # The desktop app (app/, Tauri v2; ADR-038): fmt, clippy and tests on every
  # OS, then a release bundle so a packaging break shows up in the PR rather
  # than at release time. Linux builds against WebKitGTK 4.1, Tauri v2's floor.
  app:
    name: app (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: deb
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The Go cache the go job writes on master; read-only here.
      - name: go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # Cargo's registry and the compiled dependencies, keyed by OS, rustc and
      # Cargo.lock; the app crate itself always rebuilds. Written from master
      # only. release.yml's Windows app job reads the same key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target
          shared-key: app-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' }}
      - name: fmt, clippy, test
        run: make app-test
      - name: bundle
        run: make app-bundle APP_BUNDLES=${{ matrix.bundles }}
      # The branded .dmg window: the picture has to be inside the image, or
      # the window opens as a bare Finder folder and nothing else says so.
      - name: dmg background
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          ls -la "$mnt" "$mnt/.background"
          ls "$mnt/.background/"*.png >/dev/null
          test -d "$mnt/Caprock.app"
          test -L "$mnt/Applications"
      # The microphone (ADR-045): without the entitlement the hardened
      # runtime refuses an agent's voice mode silently.
      - name: microphone entitlement
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/check-app-mic.sh app/src-tauri/target/release/bundle/macos/Caprock.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: caprock-app-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3
