name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: ui (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test -- --run
        working-directory: ui
      - name: release script tests (latest.json)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run build
        working-directory: ui
      - name: dist is committed and in sync (so `go install` embeds a real UI)
        run: |
          git diff --quiet -- internal/api/dist || {
            echo "internal/api/dist/ is stale — run 'make ui' and commit the result";
            git --no-pager diff --stat -- internal/api/dist; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: ui-dist
          path: internal/api/dist
          if-no-files-found: error
          retention-days: 3

  go:
    name: go (${{ matrix.os }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v7.0.0
        with:
          name: ui-dist
          path: internal/api/dist
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: go test
        run: go test -v -count=1 ./...
      - name: build
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X github.com/dspv/caprock/internal/version.Version=${GITHUB_SHA::7}" -o bin/ ./cmd/...
      - name: smoke (Phase 0 DoD scenario)
        run: go test -count=1 -tags smoke ./internal/smoke/... ./internal/board/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: caprock-${{ matrix.os }}
          path: bin/
          retention-days: 3

  # T0 — ConPTY spike. Informational: it must never redden the required jobs
  # (ADR-006 / .ai/09-execution-plan.md T0). Its result is the go/no-go for T11.
  pty-spike:
    name: pty spike (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: spike
        run: go test -count=1 -v -tags ptyspike ./internal/ptyman/...

  # `make build` on Windows, which nothing else here checks.
  #
  # Every other job invokes go and npm directly, so the Windows matrix stayed
  # green for months while the first command in CONTRIBUTING.md failed on a
  # Windows clone (FB-025). A green matrix is not the same as a working
  # repository, and the only way to keep this fixed is to run the thing a
  # contributor actually runs.
  make-windows:
    name: make build (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The default shell here is PowerShell; a contributor's is whatever their
      # terminal is. What is being tested is that make itself works, so invoke
      # it the plainest way and let the Makefile pick its own shell.
      - name: make build
        run: make build
      - name: the binaries exist
        run: |
          if (-not (Test-Path bin/caprock.exe)) { throw "bin/caprock.exe missing" }
          if (-not (Test-Path bin/caprock-hook.exe)) { throw "bin/caprock-hook.exe missing" }

  # The desktop app (app/, Tauri v2; ADR-038): fmt, clippy and tests on every
  # OS, then a release bundle so a packaging break shows up in the PR rather
  # than at release time. Linux builds against WebKitGTK 4.1, Tauri v2's floor.
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: deb
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: app-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: app-${{ runner.os }}-
      - name: fmt, clippy, test
        run: make app-test
      - name: bundle
        run: make app-bundle APP_BUNDLES=${{ matrix.bundles }}
      # The branded .dmg window: the picture has to be inside the image, or
      # the window opens as a bare Finder folder and nothing else says so.
      - name: dmg background
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          ls -la "$mnt" "$mnt/.background"
          ls "$mnt/.background/"*.png >/dev/null
          test -d "$mnt/Caprock.app"
          test -L "$mnt/Applications"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: caprock-app-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3
