name: docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: tables aligned, links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Both scripts are pure-python with no dependencies.
      - name: Check documentation
        run: make docs-check docs-links
