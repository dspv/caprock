name: docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: tables aligned, links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      # Both scripts are pure-python with no dependencies.
      - name: Check documentation
        run: make docs-check docs-links
