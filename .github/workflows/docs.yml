name: docs

on:
  push:
    branches: [master]
  # Draft pull requests run nothing: contributors iterate with `make check`
  # locally and CI runs once, when the PR is marked ready (ADR-061).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# As in ci.yml: a new push to a pull request cancels the run it supersedes.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    name: tables aligned, links resolve, no Cyrillic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # All three scripts are pure-python with no dependencies.
      - name: Check documentation
        run: make docs-check docs-links lang-check
