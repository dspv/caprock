name: docs

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: tables aligned, links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `make check` runs docs-check and docs-links. Both are pure-python with no
      # dependencies, so there is nothing to install.
      - name: Check documentation
        run: make check
