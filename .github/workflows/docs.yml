name: docs

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: tables aligned, links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both scripts are pure-python with no dependencies.
      - name: Check documentation
        run: make docs-check docs-links
