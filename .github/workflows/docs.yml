name: docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: tables aligned, links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      # Both scripts are pure-python with no dependencies.
      - name: Check documentation
        run: make docs-check docs-links
