name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Gate: re-run the full check suite on the exact tagged commit before anything
  # is built or published. A tag push does not otherwise re-run ci.yml (it fires
  # on branches/PRs, not tags), so without this a tag on a red commit would ship
  # straight to every `brew install`. goreleaser runs only if this passes.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Build the UI first: internal/api embeds it via `//go:embed all:dist`, so
      # golangci-lint's typecheck fails ("no matching files") on an empty dist/.
      - run: npm ci && npm run build
        working-directory: ui
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
      - name: make check (docs + lint + tests + smoke)
        run: make check
      - name: windows cross-build
        run: GOOS=windows go build ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pinned: the `brews` formula block is valid on 2.17.x. A later v2
          # renames it to `homebrew_formulas`, so let the pin move deliberately
          # (with a config edit) rather than float and break a release.
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on dspv/homebrew-tap so goreleaser can push
          # the formula (the default GITHUB_TOKEN cannot write to another repo). The
          # `|| ''` keeps the env key present (goreleaser's {{ .Env.X }} requires
          # it) so a missing secret degrades to skip, not a hard error.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || '' }}
