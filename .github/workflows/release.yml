name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release run per tag, ever.
#
# A tag push once delivered two events three seconds apart, so two runs built
# the same tag at once: one uploaded the binaries and the other died on
# `422 already_exists`, leaving a red release beside a perfectly good one. The
# worse version of the same race is both runs uploading a subset and the
# release ending up with half its binaries.
#
# cancel-in-progress is false on purpose: the first run is the one holding the
# upload, and cancelling it to start again would be trading a confusing failure
# for a broken release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: re-run the full check suite on the exact tagged commit before anything
  # is published. A tag push does not otherwise re-run ci.yml (it fires on
  # branches/PRs, not tags), so without this a tag on a red commit would ship
  # straight to every `brew install`. goreleaser, the only job that publishes
  # by itself, needs both halves; the app files it gets later are attached
  # only after it.
  #
  # The two halves of `make check` (check-go, check-ui) run side by side, and
  # the desktop app builds alongside them: building writes nothing anywhere a
  # user can see, so it need not wait.
  verify:
    name: verify (${{ matrix.half }})
    strategy:
      fail-fast: false
      matrix:
        half: [go, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.half == 'ui'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: make check-ui (typecheck, vitest, release script tests, dist sync)
        if: matrix.half == 'ui'
        run: make ui-install check-ui
      # The Go half builds against the committed internal/api/dist (what
      # `go install` embeds); the ui half fails if that copy is stale.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.half == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - name: go cache paths
        if: matrix.half == 'go'
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # The cache ci.yml's go job writes on master (a tag reads master's).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.half == 'go'
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-
      # Installs golangci-lint for make's lint-go, which runs it.
      - name: golangci-lint
        if: matrix.half == 'go'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
      - name: make check-go (docs gates, vet + golangci-lint, go test, smoke)
        if: matrix.half == 'go'
        run: make check-go
      - name: windows cross-build
        if: matrix.half == 'go'
        run: GOOS=windows go build ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The release body is what the dashboard shows under "what's new", and
      # goreleaser's default is a list of commit subjects with their hashes.
      # CHANGELOG.md already says what changed in prose; use that. A missing
      # section fails here rather than shipping an empty "what's new".
      - name: Release notes from CHANGELOG
        run: python3 scripts/release-notes.py "${GITHUB_REF_NAME}" > /tmp/release-notes.md
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned so the toolchain moves deliberately rather than floating
          # into a broken release. 2.17.1 is also the current latest.
          #
          # It warns that `brews` is deprecated; that is expected and the
          # release still succeeds. The replacement is `homebrew_casks`, which
          # is macOS-only and would break `brew install` on Linux — see the
          # long note in .goreleaser.yaml before changing either.
          version: "2.17.1"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on dspv/homebrew-tap so goreleaser can push
          # the formula (the default GITHUB_TOKEN cannot write to another repo). The
          # `|| ''` keeps the env key present (goreleaser's {{ .Env.X }} requires
          # it) so a missing secret degrades to skip, not a hard error.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || '' }}
          # Always defined, even when the secret is unset. goreleaser resolves
          # `{{ .Env.WINGET_TOKEN }}` before it consults skip_upload, so an
          # absent key fails the whole release rather than skipping winget —
          # which is exactly what v0.36.0's first release run did.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN || '' }}
          # Mail's Sign in with Google / Microsoft (docs/mail-oauth.md),
          # compiled into the daemon with -X. Unset, the build still succeeds
          # and Mail offers app passwords instead of the buttons.
          CAPROCK_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.CAPROCK_MAIL_GOOGLE_CLIENT_ID || '' }}
          CAPROCK_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CAPROCK_MAIL_GOOGLE_CLIENT_SECRET || '' }}
          CAPROCK_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.CAPROCK_MAIL_MICROSOFT_CLIENT_ID || '' }}

  # The desktop app (app/, Tauri v2; WP-17), built from the same tagged commit
  # so it bundles that daemon. Each OS builds while verify runs and hands its
  # files on as an artifact; the attach jobs put them on the release only once
  # goreleaser has published it, so a red verify leaves nothing published. One
  # job per OS and no fail-fast: a Windows or Linux failure never holds up the
  # macOS .dmg and its cask. When Actions is down, the macOS part runs by hand
  # with `make app-release TAG=vX.Y.Z` (docs/RELEASING.md); a .dmg already
  # attached makes the attach job fail rather than replace it.
  app-macos-build:
    name: app build (macos-latest)
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # The stable self-signed identity, when its secrets are set: signed with
      # one certificate, the app and daemon keep their designated requirement
      # across releases, so macOS keeps the microphone and folder answers
      # after an update. Without the secrets the build stays ad-hoc.
      - name: stable signing identity
        run: bash scripts/macos-selfsign-keychain.sh
        env:
          MACOS_SELFSIGN_P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12_BASE64 || '' }}
          MACOS_SELFSIGN_P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD || '' }}
      # Builds the universal daemon and app, checks the .dmg (the signature,
      # both architectures, bundle id, the daemon's version) and
      # renders the cask; --no-upload leaves the release to app-macos below.
      # With the updater key, also the signed Caprock_<v>_universal.app.tar.gz
      # and its .sig (F20, ADR-042). The `|| ''` keeps a missing secret a
      # warning in the script, not a failed release.
      - name: universal .dmg
        run: scripts/app-release.sh "${GITHUB_REF_NAME}" --no-upload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # The bundled daemon gets Mail's sign-in client IDs as goreleaser's does.
          CAPROCK_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.CAPROCK_MAIL_GOOGLE_CLIENT_ID || '' }}
          CAPROCK_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CAPROCK_MAIL_GOOGLE_CLIENT_SECRET || '' }}
          CAPROCK_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.CAPROCK_MAIL_MICROSOFT_CLIENT_ID || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: caprock-app-macos
          path: app/src-tauri/target/app-release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: caprock-app-cask
          path: app/src-tauri/target/app-release/caprock-app.rb
          if-no-files-found: error

  app-macos:
    needs: [goreleaser, app-macos-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.0
        with:
          name: caprock-app-macos
          path: app-release
      # The .dmg, and with the updater key the .app.tar.gz and its .sig.
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          gh release upload "${GITHUB_REF_NAME}" app-release/*.dmg app-release/*.app.tar.gz app-release/*.app.tar.gz.sig
      # The cask goes to the tap beside the formula, with the same rules: a
      # stable tag only, and only when the tap token is set.
      - name: cask to dspv/homebrew-tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || '' }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN unset: cask not pushed"; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/dspv/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp app-release/caprock-app.rb "$RUNNER_TEMP/tap/Casks/caprock-app.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/caprock-app.rb
          git -c user.name="caprock-release" -c user.email="caprock-release@users.noreply.github.com" \
            commit -q -m "caprock-app ${GITHUB_REF_NAME#v}"
          git push -q origin HEAD

  app-other-build:
    name: app build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 22.04, not latest: an AppImage runs on distributions at least as
          # new as the glibc it was built against.
          - os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      # As in ci.yml's app job: rust-cache hashes CARGO_* variables into its key.
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf file
      # The dependencies ci.yml's app job compiled on master, same profile and
      # host: the Windows build then compiles only the app crate. Read-only (a
      # tag's cache would serve no later tag). Ubuntu 22.04 has no match, on
      # purpose: build scripts compiled against 24.04's glibc would not run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target
          shared-key: app-${{ matrix.os }}
          save-if: false
      # With the updater key the NSIS installer and the AppImage get a .sig
      # beside them: they are the update bundles themselves (F20, ADR-042).
      - name: bundle
        run: |
          V="${GITHUB_REF_NAME#v}"
          make app-bundle APP_BUNDLES=${{ matrix.bundles }} VERSION="$V" APP_VERSION="$V"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # The bundled daemon gets Mail's sign-in client IDs (the Makefile's LDFLAGS).
          CAPROCK_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.CAPROCK_MAIL_GOOGLE_CLIENT_ID || '' }}
          CAPROCK_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.CAPROCK_MAIL_GOOGLE_CLIENT_SECRET || '' }}
          CAPROCK_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.CAPROCK_MAIL_MICROSOFT_CLIENT_ID || '' }}
      # The release files only; the bundle directories also hold the bundler's
      # working files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: caprock-app-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # Each OS attaches what its own build made: a failed Linux build fails only
  # its own leg here (no artifact to download), never the Windows upload.
  app-other:
    needs: [goreleaser, app-other-build]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.0
        with:
          name: caprock-app-${{ matrix.os }}
          path: files
      # nullglob: a .sig exists only when the key is configured.
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob globstar
          files=(files/**/*.exe files/**/*.exe.sig files/**/*.AppImage files/**/*.AppImage.sig files/**/*.deb files/**/*.rpm)
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}"

  # Version-less copies of the app files (Caprock-macOS.dmg,
  # Caprock-Windows-setup.exe, Caprock-Linux.AppImage/.deb/.rpm) so
  # releases/latest/download/<name> is a link that never changes, their lines in
  # checksums.txt, latest.json for the app's updater (from the .sig files the
  # jobs above attached), and only then the Latest mark goreleaser left off
  # (.goreleaser.yaml, make_latest: false). Runs when an app job failed too:
  # whatever was attached gets its copy, and the script refuses to mark Latest
  # with a file missing, so the previous release's links keep working.
  app-latest:
    needs: [goreleaser, app-macos, app-other]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version-less app files, checksums, Latest
        run: scripts/app-latest.sh "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
