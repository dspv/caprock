version: 2
project_name: caprock

before:
  hooks:
    - go mod tidy

builds:
  - id: caprock
    main: ./cmd/caprock
    binary: caprock
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/dspv/caprock/internal/version.Version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
  - id: caprock-hook
    main: ./cmd/caprock-hook
    binary: caprock-hook
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/dspv/caprock/internal/version.Version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

universal_binaries:
  - id: caprock-universal
    ids: [caprock]
    replace: false
  - id: caprock-hook-universal
    ids: [caprock-hook]
    replace: false

archives:
  - id: default
    ids: [caprock, caprock-hook]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# The release body is CHANGELOG.md's entry for this version, not a list of
# commit subjects.
#
# The dashboard shows this text under "what's new" (GET /v1/update carries it),
# and a generated list of `1c836d5: fix(ui): …` lines is not something anyone
# reads. CHANGELOG.md already says what changed in prose, which is the thing
# worth putting in front of a person. `scripts/release-notes.py` extracts the
# section for the tag being built; release.yml writes it to a file and passes
# it as --release-notes.
changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs", "^chore", "^ci"]

# `brews` is deprecated upstream and we are keeping it on purpose. Read this
# before "fixing" the warning — the obvious fix breaks Linux installs.
#
# goreleaser's replacement is `homebrew_casks` (not `homebrew_formulas`, which
# an earlier comment here guessed). That is not a rename: casks are macOS-only.
# Homebrew on Linux refuses them outright —
# Library/Homebrew/extend/os/linux/cask/installer.rb raises
# "This cask requires macOS" unless the cask declares supports_linux?, which a
# goreleaser-generated cask over darwin archives does not. Switching would break
# `brew install dspv/tap/caprock` on Linux, which the README promises and the
# shipped formula delivers (it carries on_linux amd64/arm64 blocks).
#
# It also reverses a deliberate decision: the tap moved cask → formula on
# 2026-08-19 for exactly this reason (ADR-023, docs/RELEASING.md).
#
# The deprecation is not urgent. Measured on 2026-08-20 with goreleaser 2.17.1,
# which is the current latest release:
#   - `goreleaser release` and `goreleaser build` succeed and only warn
#     (v0.9.8 shipped through this path);
#   - only `goreleaser check` exits non-zero.
# Upstream policy removes deprecated options on major versions only, so `brews`
# holds for all of v2. Revisit when v3 actually ships — at which point Linux
# likely needs a hand-maintained formula in the tap alongside the cask.
brews:
  - name: caprock
    # Write the formula to Formula/ (the Homebrew standard). Without this
    # goreleaser writes caprock.rb to the tap repo root, which `brew install
    # dspv/tap/caprock` ignores in favour of Formula/caprock.rb — so the tap
    # would silently serve a stale formula.
    directory: Formula
    # A CLI binary belongs in a formula, not a cask (casks are for GUI .app
    # bundles). A formula also installs cleanly on Linux Homebrew.
    # Tap repo dspv/homebrew-tap (public); the formula is pushed here on release.
    repository:
      owner: dspv
      name: homebrew-tap
      # The default GITHUB_TOKEN cannot write to another repo (the tap), so use a
      # dedicated PAT with contents:write on dspv/homebrew-tap, provided as the
      # HOMEBREW_TAP_TOKEN secret. If the secret is unset the value is empty and
      # skip_upload:auto below skips the push instead of failing the release.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://caprock.dev"
    description: "Mission control for Claude Code — watch, control and orchestrate your sessions"
    license: "Apache-2.0"
    # Push the formula on a normal release; skip only on a prerelease (an -rc /
    # -beta tag) or when the tap token is unavailable. The release is no longer a
    # draft (see release.draft below), so a stable tag pushes the formula
    # automatically — no manual refresh step.
    skip_upload: auto
    install: |
      bin.install "caprock"
      bin.install "caprock-hook"
    caveats: |
      Start it with:  caprock up
      Then open:      http://127.0.0.1:4173

# Windows install via Scoop — the manifest is pushed to dspv/scoop-bucket on a
# normal release (skipped on a prerelease or when the token is missing), so
# Windows users run `scoop bucket add dspv https://github.com/dspv/scoop-bucket`
# then `scoop install caprock` instead of hand-downloading a zip.
scoops:
  - name: caprock
    repository:
      owner: dspv
      name: scoop-bucket
      # Same reason as the tap: the default GITHUB_TOKEN can't write another repo,
      # so reuse the HOMEBREW_TAP_TOKEN PAT (contents:write). Grant it scope on
      # dspv/scoop-bucket too. Missing token → empty → skip_upload:auto skips.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://caprock.dev"
    description: "Mission control for Claude Code — watch, control and orchestrate your sessions"
    license: "Apache-2.0"
    skip_upload: auto

# winget, the package manager already present on every Windows 10 and 11
# machine — no bucket to add first, unlike Scoop.
#
# Deferred until there was Windows demand (ADR-014). The first Windows user to
# build Caprock from source asked for it by name (FB-024), which is that demand.
#
# Unlike the tap and the bucket, this one is not ours to publish into: the
# manifest goes as a pull request to microsoft/winget-pkgs, reviewed and merged
# by Microsoft. A release therefore reaches winget hours or days after it
# reaches everywhere else. That lag is the channel, not a fault to fix.
#
# The PR is opened from a fork we own. WINGET_TOKEN needs contents:write on
# dspv/winget-pkgs and the ability to open a PR against microsoft/winget-pkgs;
# a missing token leaves it empty and skip_upload:auto skips, as with the other
# two.
winget:
  - name: caprock
    publisher: dspv
    package_identifier: dspv.caprock
    short_description: "Mission control for Claude Code — watch, control and orchestrate your sessions"
    license: "Apache-2.0"
    homepage: "https://caprock.dev"
    publisher_url: "https://caprock.dev"
    repository:
      owner: dspv
      name: winget-pkgs
      branch: "caprock-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: auto

release:
  # Not a draft: goreleaser publishes the release directly, which is also what
  # lets it push the Homebrew formula (skip_upload:auto skips on draft). release.yml
  # gates goreleaser behind a `verify` job that re-runs `make check` + the Windows
  # cross-build on the exact tagged commit, so a tag on a red commit never ships.
  # (The full 3-OS matrix runs on master before the tag is cut.) Cutting a
  # `-rc`/`-beta` tag still marks the release a prerelease (prerelease:auto) and
  # skips the formula push.
  draft: false
  prerelease: auto
