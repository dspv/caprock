version: 2
project_name: caprock

before:
  hooks:
    - go mod tidy

builds:
  - id: caprock
    main: ./cmd/caprock
    binary: caprock
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/dspv/caprock/internal/version.Version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
  - id: caprock-hook
    main: ./cmd/caprock-hook
    binary: caprock-hook
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/dspv/caprock/internal/version.Version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

universal_binaries:
  - id: caprock-universal
    ids: [caprock]
    replace: false
  - id: caprock-hook-universal
    ids: [caprock-hook]
    replace: false

archives:
  - id: default
    ids: [caprock, caprock-hook]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs", "^chore", "^ci"]

brews:
  - name: caprock
    # Write the formula to Formula/ (the Homebrew standard). Without this
    # goreleaser writes caprock.rb to the tap repo root, which `brew install
    # dspv/tap/caprock` ignores in favour of Formula/caprock.rb — so the tap
    # would silently serve a stale formula.
    directory: Formula
    # A CLI binary belongs in a formula, not a cask (casks are for GUI .app
    # bundles). A formula also installs cleanly on Linux Homebrew. `brews` is the
    # formula block; newer goreleaser renames it to `homebrew_formulas`, but the
    # pinned toolchain (see release.yml) still uses `brews`.
    # Tap repo dspv/homebrew-tap (public); the formula is pushed here on release.
    repository:
      owner: dspv
      name: homebrew-tap
      # The default GITHUB_TOKEN cannot write to another repo (the tap), so use a
      # dedicated PAT with contents:write on dspv/homebrew-tap, provided as the
      # HOMEBREW_TAP_TOKEN secret. If the secret is unset the value is empty and
      # skip_upload:auto below skips the push instead of failing the release.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://caprock.dev"
    description: "Mission control for Claude Code — watch, control and orchestrate your sessions"
    license: "Apache-2.0"
    # Push the formula on a normal release; skip only on a prerelease (an -rc /
    # -beta tag) or when the tap token is unavailable. The release is no longer a
    # draft (see release.draft below), so a stable tag pushes the formula
    # automatically — no manual refresh step.
    skip_upload: auto
    install: |
      bin.install "caprock"
      bin.install "caprock-hook"
    caveats: |
      Start it with:  caprock up
      Then open:      http://127.0.0.1:4173

release:
  # Not a draft: goreleaser publishes the release directly, which is also what
  # lets it push the Homebrew formula (skip_upload:auto skips on draft). release.yml
  # gates goreleaser behind a `verify` job that re-runs `make check` + the Windows
  # cross-build on the exact tagged commit, so a tag on a red commit never ships.
  # (The full 3-OS matrix runs on master before the tag is cut.) Cutting a
  # `-rc`/`-beta` tag still marks the release a prerelease (prerelease:auto) and
  # skips the formula push.
  draft: false
  prerelease: auto
