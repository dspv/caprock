# Caprock - directory submissions
#
# Where Caprock can be listed, researched 2026-10-04 (WebSearch/WebFetch, each
# homepage checked to respond). Nothing here has been submitted by this research;
# entries already marked submitted/published were found that way on GitHub/HN.
#
# Submission email: who@caprock.dev (confirm the mailbox receives mail first -
# most sites send a verification link). Every form is filled from
# product-card.md in this directory; do not write fresh copy per site.
#
# Status flow (edit in place, one entry at a time):
#   found       researched, not yet acted on
#   ready       form fields checked against product-card.md, assets picked
#   submitted   form sent / issue or PR opened  -> set submitted_on (YYYY-MM-DD)
#   moderation  the site acknowledged it and it sits in a review queue
#   published   live                            -> set listing_url
#   rejected    turned down; say why in notes, and when it can be retried
#
# Order is expected value: coding-agent audience and free first, then general
# developer / open-source directories, then free-with-a-backlink, then
# not-yet-eligible, then paid. Within a tier, earlier = better fit.
#
# Field rules: cost prices carry the date they were read; authority is only a
# figure someone published (often the directory's own claim - treat as such)
# or "unknown", never an estimate; needs_account counts a GitHub account as
# yes. Re-check price and terms on the day of submission - they change.
#
# Context: .gtm/02-research.md (2026-08-23) judged AI-tool directories low
# traffic; this list exists for search presence and backlinks, and the
# curated GitHub lists in tier 1 are the ones whose audience is exactly right.

# ----------------------------------------------------------------------------
# Tier 1 - coding-agent audience, free. Do these first.
# ----------------------------------------------------------------------------

