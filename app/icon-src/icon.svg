<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2826"/>
      <stop offset="1" stop-color="#161514"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc77d"/>
      <stop offset="1" stop-color="#f39a3a"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: an 824px tile with 100px clear on every side. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- The mark, filled and large: a triangle with rounded corners. -->
  <path d="M512 252 L782 708 L242 708 Z" fill="url(#mark)" stroke="url(#mark)" stroke-width="64" stroke-linejoin="round"/>
</svg>
