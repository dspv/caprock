[package]
name = "caprock-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "Apache-2.0"
description = "Caprock desktop app: a thin Tauri shell around the daemon's dashboard (ADR-038)."

[[bin]]
name = "caprock-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# >= 2.11.1: GHSA-7gmj-67g7-phm9 let remote origins call local-only commands.
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-updater = "2"

# Linux notifications with a click and Approve/Deny over D-Bus
# (src/notify_linux.rs); the notification plugin already pulls it in.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"

# SIGTERM quits through Tauri's exit (src/sigterm.rs); already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Development aid, off in every shipped build: `--features snapshot` lets an
# automated check capture the app's own window to PNG (CAPROCK_APP_SNAPSHOT_DIR)
# on a machine where the terminal has no screen-recording permission.
[features]
snapshot = ["dep:objc2-core-graphics", "dep:objc2-core-foundation"]

# objc2, objc2-foundation, objc2-user-notifications and block2: notifications
# with Approve and Deny through UNUserNotificationCenter (src/notify_macos.rs),
# which the official notification plugin does not offer on desktop.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSPanel: the menu bar popover is a non-activating panel (src/popover.rs),
# so opening it never activates the app or raises the main window.
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPanel", "NSWindow", "NSResponder", "NSBitmapImageRep", "NSImageRep", "NSGraphics"] }
objc2-core-graphics = { version = "0.3", optional = true, features = ["CGWindow", "CGImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSString", "NSBundle", "NSError", "NSSet", "NSArray"] }
objc2-core-foundation = { version = "0.3", optional = true, features = ["CFCGTypes"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNError", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6"

[dev-dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png", "test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
