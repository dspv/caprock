<!doctype html>
<!--
  The .dmg window's background (bundle.macOS.dmg in tauri.conf.json): cool
  off-white drafting paper with a faint blue grid and a soft navy glow, the
  CAPROCK wordmark and the headline "Mission control for your agents" on
  top, a dotted navy arc from where the app icon sits to where the
  Applications folder sits, Caprock's own characters
  (ui/src/components/Characters.tsx, inlined as static SVG) walking in a row
  along the bottom between the two icons, and one quiet line at the foot
  saying what to do. The owner picked this look, "A on paper · cool", on
  2026-11-25; before, it was graphite with two wells and pale name plates
  (2026-11-01), and before that caprock.dev's paper ground. No wells and no
  plates: Finder draws the icons' names in black, which reads as it is on a
  light ground.

  The source of background.png (1x, 660x400) and background@2x.png (2x,
  1320x800). To re-render after an edit (fonts come from the dashboard's own
  packages, so run `make ui-install` first), draw this page in a 660x400
  viewport with a headless Chromium twice, at device scale factor 1 and 2,
  wait for document.fonts.ready, and save the screenshots over the two PNGs —
  for example with Playwright (ui/node_modules/playwright):
  `chromium.launch()`, then `browser.newPage({ viewport: { width: 660,
  height: 400 }, deviceScaleFactor: 2 })`, `page.goto('file://…')`,
  `page.screenshot({ path: 'background@2x.png' })`, and the same at 1 for
  background.png. Always re-render both: scripts/app-dmg.sh (dmgbuild) finds
  the @2x beside the 1x and ships the pair as one multi-resolution
  .background.tiff, which Finder draws sharp on Retina, and
  `app-dmg.sh check` fails unless that TIFF is the one made from these two.

  The arc runs from appPosition (170, 196) to applicationFolderPosition
  (490, 196): Finder places an icon's centre there, 128 points wide, its name
  under it. Change one, change both.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caprock installer background</title>
<style>
  @font-face {
    font-family: "Hanken Grotesk";
    src: url("../../../ui/node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("../../../ui/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 800;
  }
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(440px 260px at 50% 58%, #f7f6f1 0%, #eeece4 60%, #e4e1d6 100%);
    color: #1f2a3a;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* The characters' outline follows the ground, as in the app. */
    --character-outline: #eeece4;
  }
  /* A faint drafting grid, fading out towards the edges. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(40, 70, 120, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(40, 70, 120, 0.08) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(380px 230px at 50% 55%, #000, transparent);
    mask-image: radial-gradient(380px 230px at 50% 55%, #000, transparent);
  }
  .glow {
    position: absolute; left: 220px; top: 140px; width: 220px; height: 130px;
    border-radius: 50%; background: radial-gradient(rgba(60, 90, 138, 0.16), transparent 70%);
  }
  .mark {
    position: absolute; top: 30px; left: 0; right: 0; text-align: center;
    font: 700 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.42em; color: #3c5a8a;
  }
  .head {
    position: absolute; top: 50px; left: 0; right: 0; text-align: center;
    font-weight: 700; font-size: 24px; letter-spacing: -0.01em; color: #1f2a3a;
  }
  svg.arc { position: absolute; left: 232px; top: 128px; }
  .face { position: absolute; line-height: 0; }
  .foot {
    position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: #6c7380;
  }
</style>
</head>
