<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: drawn edge to edge on a phone, with the notch and
         home bar kept clear by the safe-area padding in design/tokens.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Home screen (iOS Safari "Add to Home Screen", Android Chrome "Install").
         No service worker: every figure is live and must never come from a
         cache, and a LAN http:// origin cannot register one anyway. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Caprock" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The header's colour, set before first paint by the script below and
         kept in step by lib/theme.ts. -->
    <meta name="theme-color" content="#212221" />
    <title>Caprock — mission control</title>
    <script>
      // Set the palette before first paint so nobody sees another one flash.
      // Mirrors resolveMode and THEMES in lib/themes.ts (theme.test.ts runs
      // this script against them): the kept mode while it agrees with
      // caprock-theme, else the keys from before the rename, else the OS
      // (Dark Pastel or Book). An old graphite tone was the default, not a
      // choice, so it goes to Dark Pastel; an old slate stays Dark Cold.
      (function () {
        try {
          // id: [side, sub-attribute value, panel colour, glow]
          var M = {
            'dark-pastel': ['dark', 'pastel', '#212221', 0],
            'dark-warm': ['dark', 'graphite', '#211f1d', 0],
            'dark-cold': ['dark', 'slate', '#1f2023', 0],
            'dark-side': ['dark', 'side', '#15111d', 1],
            'light': ['light', 'white', '#ffffff', 0],
            'light-cold': ['light', 'cold', '#f5f8fc', 0],
            'book': ['light', 'paper', '#f4ecdd', 0],
            'light-side': ['light', 'side', '#f9f6ef', 1]
          };
          var ls = localStorage;
          var t = ls.getItem('caprock-theme');
          var m = ls.getItem('caprock-theme-mode');
          if (!M.hasOwnProperty(m) || (M[m][0] !== t && (t === 'dark' || t === 'light'))) {
            if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            m = t === 'dark'
              ? (ls.getItem('caprock-dark-tone') === 'slate' ? 'dark-cold' : 'dark-pastel')
              : (ls.getItem('caprock-light-tone') === 'white' ? 'light' : 'book');
          }
          var r = M[m], el = document.documentElement;
          el.setAttribute('data-theme', r[0]);
          el.style.colorScheme = r[0];
          el.setAttribute(r[0] === 'dark' ? 'data-dark' : 'data-tone', r[1]);
          if (r[3]) el.setAttribute('data-glow', '');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', r[2]);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DWLycPS0.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/jsx-runtime-DU15hkma.js">
    <link rel="stylesheet" crossorigin href="/assets/index-Dzx0ZWOw.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
