    <title>Caprock — mission control</title>
    <script>
      // Set the theme before first paint so a light-preferring user never sees a
      // dark flash. Mirrors lib/theme.ts: a saved choice wins, else OS preference.
      (function () {
        try {
          var t = localStorage.getItem('caprock-theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
