<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Caprock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html { background: #0b0e14; color: #c9d1d9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
      main { border: 1px solid #1f2733; padding: 24px 28px; max-width: 520px; }
      h1 { font-size: 16px; margin: 0 0 8px; letter-spacing: .04em; text-transform: uppercase; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #8ab4f8; }
      p { margin: 6px 0; color: #8b949e; }
    </style>
  </head>
  <body>
    <main>
      <h1>Caprock — placeholder UI</h1>
      <p>The daemon is running. This binary was built without the dashboard.</p>
      <p>Build it with <code>make ui</code> then <code>make build</code>, or run <code>make dev</code>.</p>
      <p>API: <code>/v1/sessions</code> · <code>/v1/stats/summary</code> · <code>/v1/status</code> · <code>/v1/live</code></p>
    </main>
  </body>
</html>
