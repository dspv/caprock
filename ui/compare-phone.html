<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Caprock — phone home, compare</title>
    <!-- Dev only: two layouts of the phone home screen and its two sheets, on
         mocked data, for the owner to pick from. Not in the build (vite builds
         index.html alone). ?v=a|b|save|newchat|hint &theme=dark|light -->
    <script>
      (function () {
        var t = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
        var el = document.documentElement;
        el.setAttribute('data-theme', t);
        el.style.colorScheme = t;
        el.setAttribute(t === 'dark' ? 'data-dark' : 'data-tone', t === 'dark' ? 'graphite' : 'white');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/comparePhone.tsx"></script>
  </body>
</html>
